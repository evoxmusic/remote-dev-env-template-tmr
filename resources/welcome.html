<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomorro Workspace</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f11;
    color: #e4e4e7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    text-align: center;
    max-width: 480px;
    padding: 2rem;
  }
  .logo-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 2rem;
    overflow: hidden;
    border-radius: 8px;
  }
  .logo-wrap::after {
    content: "";
    position: absolute;
    top: -50%;
    left: -75%;
    width: 50%;
    height: 200%;
    background: linear-gradient(
      105deg,
      transparent 0%,
      transparent 40%,
      rgba(255,255,255,0.12) 45%,
      rgba(255,255,255,0.25) 50%,
      rgba(255,255,255,0.12) 55%,
      transparent 60%,
      transparent 100%
    );
    animation: shine 4s ease-in-out infinite;
  }
  @keyframes shine {
    0%   { left: -75%; }
    40%  { left: 125%; }
    100% { left: 125%; }
  }
  .logo { width: 180px; height: auto; display: block; }
  h1 {
    font-size: 1.75rem;
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 0.5rem;
  }
  .subtitle {
    font-size: 0.95rem;
    color: #a1a1aa;
    margin-bottom: 2.5rem;
  }
  .card {
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 12px;
    padding: 1.5rem;
    text-align: left;
  }
  .card-title {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #32D200;
    margin-bottom: 1rem;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 0.5rem 0;
    border-bottom: 1px solid #27272a;
    font-size: 0.875rem;
  }
  .row:last-child { border-bottom: none; }
  .label { color: #a1a1aa; }
  .value { color: #e4e4e7; font-weight: 500; }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    position: relative;
    top: -1px;
  }
  .no-server {
    color: #a1a1aa;
    font-size: 0.875rem;
    line-height: 1.6;
    padding: 0.75rem 0;
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap">
    <svg class="logo" viewBox="0 0 168 25" fill="none" xmlns="http://www.w3.org/2000/svg">

    </svg>
  </div>
  <h1>Welcome to your Tomorro Workspace</h1>
  <p class="subtitle">Your development environment is running</p>

</html>
